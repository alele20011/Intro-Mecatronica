<svg viewBox="0 0 600 210" width="100%" role="img" aria-label="Diagrama de conexión de un LED al ESP32 con resistencia de protección">
    <title>Esquema de conexión LED y Resistencia a ESP32</title>
    <!-- ESP32 Board -->
    <rect x="30" y="25" width="130" height="160" rx="8" fill="#2d3748" stroke="var(--border, #7f8489)" stroke-width="2" />
    <text x="95" y="55" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">ESP32</text>
    <text x="95" y="75" text-anchor="middle" fill="#a0aec0" font-size="11">Dev Module</text>

    <!-- Pins -->
    <circle cx="160" cy="95" r="5" fill="#e63946" />
    <text x="148" y="90" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold">GPIO 23</text>

    <circle cx="160" cy="145" r="5" fill="#4c8dff" />
    <text x="148" y="140" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold">GND</text>

    <!-- Wire: GPIO 23 to Resistor -->
    <path d="M 160 95 L 230 95" fill="none" stroke="#e63946" stroke-width="3" />

    <!-- Resistor -->
    <rect x="230" y="88" width="70" height="14" rx="3" fill="#d4a373" stroke="#8d5b4c" stroke-width="1.5" />
    <line x1="242" y1="88" x2="242" y2="102" stroke="#e63946" stroke-width="2" />
    <line x1="252" y1="88" x2="252" y2="102" stroke="#e63946" stroke-width="2" />
    <line x1="262" y1="88" x2="262" y2="102" stroke="#a5a5a5" stroke-width="2" />
    <line x1="280" y1="88" x2="280" y2="102" stroke="#d4af37" stroke-width="2" />
    <text x="265" y="78" text-anchor="middle" fill="currentColor" font-size="11" font-weight="bold">220 Ω - 330 Ω</text>

    <!-- Wire: Resistor to LED Anode -->
    <path d="M 300 95 L 360 95" fill="none" stroke="#e63946" stroke-width="3" />

    <!-- LED Symbol -->
    <path d="M 370 80 Q 385 65 400 80 L 400 110 L 370 110 Z" fill="#e63946" fill-opacity="0.85" stroke="#b71c1c" stroke-width="2" />
    <path d="M 360 95 L 370 95" fill="none" stroke="#e63946" stroke-width="3" />
    <path d="M 400 95 L 430 95" fill="none" stroke="#4c8dff" stroke-width="3" />

    <!-- LED Labels -->
    <text x="365" y="125" text-anchor="middle" fill="currentColor" font-size="10">Ánodo (+)</text>
    <text x="410" y="125" text-anchor="middle" fill="currentColor" font-size="10">Cátodo (-)</text>
    <text x="385" y="60" text-anchor="middle" fill="currentColor" font-size="12" font-weight="bold">LED</text>

    <!-- Wire: Cathode to GND -->
    <path d="M 430 95 L 460 95 L 460 145 L 160 145" fill="none" stroke="#4c8dff" stroke-width="3" />
  </svg>